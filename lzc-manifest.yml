name: FastNet
package: cloud.lazycat.app.fastnet
version: 0.1.0
min_os_version: 1.3.8
description: "全平台的测速软件"
homepage: https://fw.koolcenter.com/binary/fastnet/
author: xkand

application:
  subdomain: fastnet
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://host.lzcapp:7171/

services:
  fastnet:
    # xkand/fastnet
    image: registry.lazycat.cloud/czyt/xkand/fastnet:562480121f99a3d5
    environment:
      - PORT=7171
    network_mode: host
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:7171/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

locales:
  zh:
    name: "FastNet"
    description: "全平台的测速软件"
  en:
    name: "FastNet"
    description: "network speed test software"
