application:
  subdomain: fastnet
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://host.lzcapp:7171/
services:
  fastnet:
    # upstream: xkand/fastnet:latest
    image: docker.1ms.run/xkand/fastnet:latest@sha256:7063a7daf48eb95f581d87a089cacdb153fec0811b92c0fe690b2159dfad7ba1
    environment:
      - PORT=7171
    network_mode: host
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:7171/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
